<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị lì xì 20/10</title>
<style>
:root{--pink:#ffd6e3;--rose:#f0709b;--cream:#fff8ef;--gold:#f5b942;--gold2:#e39a14;--ink:#5a2a3c;--soft:#8c5d6f;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff3f7;color:var(--ink);line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 12px;color:var(--rose)}
h2{font-size:16px;margin:0 0 10px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(240,112,155,.12);animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--pink);color:var(--rose);transition:transform .12s}
button:active{transform:scale(.95)}
button.pri{background:var(--gold);color:#6b4200}
button.bad{background:#ffe1e1;color:#c0392b}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--pink);background:var(--cream);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:13px}
.draft{background:#eee;color:#666}.open{background:#d9f7e4;color:#1b7a43}.closed{background:#ffe1e1;color:#c0392b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid label{font-size:13px;color:var(--soft);display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--cream);border-radius:12px;padding:8px 4px;font-size:12px;color:var(--soft)}
.stats b{display:block;font-size:16px;color:var(--ink)}
.pl{border-top:1px solid #f6dce5;padding:10px 0}
.pl:first-child{border-top:0}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:1px;background:var(--cream);padding:2px 8px;border-radius:8px}
.won{font-weight:800;color:var(--gold2)}
.err{color:#c0392b;font-weight:700;margin:8px 0 0}
.small{font-size:13px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧧 Quản trị lì xì 20/10</h1>
  <div id="app"><p class="small">Đang tải…</p></div>
</div>
<script>
const API = (window.__HATCHABLE__ && window.__HATCHABLE__.api) || "/api";
const DEN = [10000, 20000, 50000, 100000, 200000, 500000];
const $ = (id) => document.getElementById(id);
const money = (n) => Number(n || 0).toLocaleString("vi-VN") + "đ";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let S = null, err = "";

async function call(method, body) {
  const r = await fetch(API + "/admin", { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 || r.status === 403) { needLogin(d); throw new Error("auth"); }
  if (!r.ok) { err = d.message || "Có lỗi xảy ra."; render(); throw new Error("fail"); }
  err = ""; S = d; render();
}
function needLogin(d) {
  const url = d.login_url || ("/login?next=" + encodeURIComponent(location.pathname));
  $("app").innerHTML = '<div class="card"><h2>Cần đăng nhập</h2><p class="small">Trang này chỉ dành cho quản trị viên. Đăng nhập bằng tài khoản Hatchable của chủ dự án.</p><a href="' + esc(url) + '"><button class="pri">Đăng nhập</button></a></div>';
}
const act = (b) => call("POST", b).catch(() => {});

function render() {
  const s = S; if (!s) return;
  const drawn = s.players.filter((p) => p.amount), paid = drawn.filter((p) => p.paid);
  const won = drawn.reduce((a, p) => a + p.amount, 0), paidSum = paid.reduce((a, p) => a + p.amount, 0);
  const draft = s.status === "draft";
  const label = { draft: "Chưa mở", open: "Đang mở", closed: "Đã đóng" }[s.status];
  $("app").innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">Trạng thái <span class="badge ${s.status}">${label}</span></h2></div>
    <div class="stats" style="margin:12px 0">
      <div><b>${money(s.budget)}</b>Ngân sách</div><div><b>${money(s.committed)}</b>Tổng giải</div><div><b>${money(won)}</b>Đã trúng</div>
      <div><b>${money(paidSum)}</b>Đã trao</div><div><b>${money(won - paidSum)}</b>Còn phải trao</div><div><b>${drawn.length}/${s.players.length}</b>Đã rút</div>
    </div>
    <div class="row">
      <button class="pri" ${s.status === "open" ? "disabled" : ""} onclick="act({action:'set_status',status:'open'})">${draft ? "Mở chương trình" : "Mở lại"}</button>
      <button class="bad" ${s.status !== "open" ? "disabled" : ""} onclick="if(confirm('Đóng chương trình?'))act({action:'set_status',status:'closed'})">Đóng chương trình</button>
    </div>
    ${err ? '<p class="err">' + esc(err) + "</p>" : ""}
  </div>

  <div class="card">
    <h2>Cấu hình giải ${draft ? "" : '<span class="small">(đã khóa vì chương trình đã mở)</span>'}</h2>
    <label class="small">Ngân sách tối đa (đ)</label>
    <input id="budget" type="number" min="0" step="1000" value="${s.budget}" ${draft ? "" : "disabled"} oninput="calc()">
    <div class="grid" style="margin-top:10px">
      ${DEN.map((d) => `<div><label>Số giải ${d / 1000}k</label><input class="q" data-d="${d}" type="number" min="0" max="500" value="${s.qty[d] || 0}" ${draft ? "" : "disabled"} oninput="calc()"></div>`).join("")}
    </div>
    <p class="small" id="tot" style="margin:10px 0"></p>
    <button class="pri" ${draft ? "" : "disabled"} onclick="saveCfg()">Lưu cấu hình</button>
  </div>

  <div class="card">
    <h2>Thêm người chơi</h2>
    <textarea id="names" rows="3" placeholder="Mỗi dòng một tên (mã sẽ là tên viết liền không dấu)"></textarea>
    <div style="margin-top:8px"><button class="pri" onclick="addP()">Thêm và tạo mã</button></div>
  </div>

  <div class="card">
    <h2>Người chơi (${s.players.length})</h2>
    ${s.players.length ? s.players.map((p) => `
      <div class="pl">
        <div class="row" style="justify-content:space-between"><b>${esc(p.name)}</b>
          ${p.amount ? '<span class="won">' + money(p.amount) + "</span>" : '<span class="small">chưa rút</span>'}</div>
        <div class="row" style="margin-top:6px">
          <span class="code">${esc(p.code)}</span>
          <button onclick="copyLink('${esc(p.code)}')">Chép link</button>
          ${p.amount ? `<button class="${p.paid ? "" : "pri"}" onclick="act({action:'mark_paid',player_id:${p.id},paid:${!p.paid}})">${p.paid ? "✓ Đã trao (bỏ)" : "Đánh dấu đã trao"}</button>` : ""}
        </div>
      </div>`).join("") : '<p class="small">Chưa có ai.</p>'}
  </div>`;
  calc();
}
function calc() {
  const b = Number($("budget")?.value || 0);
  let t = 0, n = 0;
  document.querySelectorAll(".q").forEach((i) => { t += Number(i.value || 0) * Number(i.dataset.d); n += Number(i.value || 0); });
  const el = $("tot"); if (!el) return;
  el.textContent = n + " giải, tổng " + money(t) + (t > b ? " — vượt ngân sách!" : " — còn dư " + money(b - t));
  el.style.color = t > b ? "#c0392b" : "";
}
function saveCfg() {
  const qty = {}; document.querySelectorAll(".q").forEach((i) => { qty[i.dataset.d] = Number(i.value || 0); });
  act({ action: "save_config", budget: Number($("budget").value || 0), qty });
}
function addP() {
  const names = $("names").value.split("\n").map((x) => x.trim()).filter(Boolean);
  if (names.length) act({ action: "add_players", names });
}
async function copyLink(code) {
  const link = location.origin + "/?code=" + code;
  try { await navigator.clipboard.writeText(link); alert("Đã chép link:\n" + link); } catch (e) { prompt("Chép link này:", link); }
}
call("GET").catch(() => {});
</script>
</body>
</html>
